name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Verify committed bundles are reproducible
        run: git diff --exit-code -- lib/

      - name: Run test suite
        run: npm test

      - name: Validate release metadata
        run: node scripts/validate-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Prepare release assets
        shell: bash
        run: |
          set -e
          mkdir -p dist
          rm -rf dist/*
          
          # 1. 生成 npm 规范分发包
          npm pack --pack-destination dist/
          
          # 2. 生成编译产物压缩包
          zip -r dist/dsh-quota-bundles.zip lib cordis.patch.yml package.json README.md LICENSE

          # 3. 计算 SHA-256 与生成清单
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");

          const distDir = path.join(process.cwd(), "dist");
          const files = fs.readdirSync(distDir).filter(f => !f.endsWith(".sha256") && f !== "release-manifest.json");
          const assets = [];

          for (const f of files) {
            const fullPath = path.join(distDir, f);
            const content = fs.readFileSync(fullPath);
            const hash = crypto.createHash("sha256").update(content).digest("hex");
            fs.writeFileSync(fullPath + ".sha256", hash + "  " + f);
            assets.push({
              name: f,
              sha256: hash,
              type: f.endsWith(".tgz") ? "application/gzip" : (f.endsWith(".zip") ? "application/zip" : "application/octet-stream")
            });
          }

          const tag = process.env.GITHUB_REF_NAME || "v0.2.2";
          const manifest = {
            schema_version: 1,
            project: "Francesco502/dsh-quota",
            version: tag.replace(/^v/, ""),
            tag: tag,
            commit: process.env.GITHUB_SHA,
            generated_at: new Date().toISOString(),
            assets: assets
          };
          fs.writeFileSync(path.join(distDir, "release-manifest.json"), JSON.stringify(manifest, null, 2));
          console.log("Generated manifest and checksums for:", files);
          '

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "dsh-quota $GITHUB_REF_NAME" --generate-notes
