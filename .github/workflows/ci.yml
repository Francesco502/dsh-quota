name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Verify committed bundles are reproducible
        run: git diff --exit-code -- lib/

      - name: Run test suite
        run: npm test

      - name: Validate release metadata (dry run)
        run: node scripts/validate-release.mjs --tag "v$(node -p "require('./package.json').version")"
